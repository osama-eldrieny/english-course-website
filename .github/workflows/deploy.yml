name: Deploy to FTP

on:
  push:
    branches:
      - main

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build CSS
        run: npm run build

      # The server caches /assets for 30 days, so browsers keep running old
      # CSS/JS after a deploy. Stamp every local asset/partial reference with
      # the commit SHA so each deploy is fetched fresh.
      - name: Cache-bust asset URLs
        run: |
          VERSION="${GITHUB_SHA::7}"
          find . -name '*.html' -not -path './node_modules/*' -print0 \
            | xargs -0 sed -i -E "s#((src|href|data-include)=\"/assets/[^\"?]+\.(js|css|html))\"#\1?v=${VERSION}\"#g"
          grep -rc "?v=${VERSION}" --include='*.html' . --exclude-dir=node_modules | grep -v ':0$' | head -5

      - name: Deploy over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/requirements/**
            **/.claude/**
