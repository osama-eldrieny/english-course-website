<!DOCTYPE html>
<html lang="en">
<head>
  <script>(function(){try{var t=localStorage.getItem("theme")||"theme5";if(t!=="default")document.documentElement.setAttribute("data-theme",t);}catch(e){document.documentElement.setAttribute("data-theme","theme5");}})();</script>
  <script>
    // Runs synchronously before the page paints, so a returning admin (with
    // a password already remembered for this browser tab) never sees the
    // login form flash before the auto-login finishes — this decides which
    // of #password-gate / #session-loading / #editor to show up front via
    // a class on <html>, and admin-placement-questions.js takes over once
    // the actual login check resolves.
    (function () {
      try {
        document.documentElement.className += sessionStorage.getItem('speakfirst_admin_password') ? ' admin-session-pending' : ' admin-session-none';
      } catch (e) {
        document.documentElement.className += ' admin-session-none';
      }
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="/assets/imgs/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/imgs/favicon-32.png">
  <link rel="apple-touch-icon" href="/assets/imgs/apple-touch-icon.png">
  <title>Placement Test — Question Editor</title>
  <link rel="stylesheet" href="/assets/css/output.css">
  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
  <script src="https://unpkg.com/lucide"></script>
  <script src="/assets/js/theme.js"></script>
  <script src="/assets/js/include.js"></script>
  <style>
    .q-row { background: #fff; border: 1px solid var(--color-gray-200, #e4e3df); border-radius: 16px; padding: 1.25rem 1.5rem; margin-bottom: 1rem; box-shadow: 0 1px 2px rgba(20, 33, 61, 0.04); transition: border-color 0.15s ease, box-shadow 0.15s ease; }
    .q-row.bg-navy-tint { background: var(--color-navy-tint, #dfe3ea); border-color: transparent; box-shadow: none; }
    .q-row:hover { border-color: var(--color-gray-400, #a3a7b0); }
    .q-row:focus-within { border-color: var(--color-gold, #0a7f78); box-shadow: 0 0 0 3px var(--color-gold-tint, #e2f0ee); }
    .q-row textarea { min-height: 3rem; }
    .q-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; }
    @media (max-width: 700px) { .q-grid { grid-template-columns: 1fr; } }
    .field label { display: block; font-size: 0.7rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--color-slate-blue, #4a5670); margin-bottom: 0.35rem; }
    #password-gate { max-width: 400px; margin: 4rem auto; }
    .section-nav-item { display: block; width: 100%; text-align: left; padding: 0.6rem 0.75rem; border-radius: 8px; font-size: 0.875rem; background: #fff; margin-bottom: 0.375rem; }
    .section-nav-item:hover { background: var(--color-navy-tint, #eef2f7); }
    .section-nav-item.active { background: var(--color-navy, #1e3a5f); color: #fff; font-weight: 600; }
    .section-nav-item .nav-id { display: block; font-size: 0.7rem; opacity: 0.7; }
    #session-loading { max-width: 400px; margin: 4rem auto; text-align: center; display: none; }
    html.admin-session-pending #password-gate { display: none; }
    html.admin-session-pending #session-loading { display: block; }
    .spinner-sm { width: 28px; height: 28px; border-radius: 9999px; border: 3px solid var(--color-navy-tint, #e2e8f0); border-top-color: var(--color-navy, #1e3a5f); animation: spin-sm 0.8s linear infinite; margin: 0 auto 0.75rem; }
    @keyframes spin-sm { to { transform: rotate(360deg); } }

    .q-row-footer { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; flex-wrap: wrap; margin-top: 1.25rem; padding-top: 1rem; border-top: 1px solid var(--color-navy-tint, #e2e8f0); }
    .toggle-switch { display: inline-flex; align-items: center; gap: 0.6rem; cursor: pointer; user-select: none; }
    .toggle-switch span { font-size: 0.8rem; font-weight: 600; color: var(--color-navy, #1e3a5f); }
    .toggle-switch input { position: absolute; opacity: 0; width: 0; height: 0; }
    .toggle-switch .track { position: relative; width: 40px; height: 22px; border-radius: 9999px; background: #d1d9e2; transition: background 0.2s ease; flex-shrink: 0; }
    .toggle-switch .track::after { content: ''; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 9999px; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,0.2); transition: transform 0.2s ease; }
    .toggle-switch input:checked + .track { background: var(--color-navy, #1e3a5f); }
    .toggle-switch input:checked + .track::after { transform: translateX(18px); }

    .actions-row { display: flex; gap: 0.75rem; margin-top: 1rem; }

    .q-row-header { display: flex; align-items: center; gap: 0.75rem; }
    .q-row-header .field label { display: none; }
    .q-row-header-field { flex: 0 0 auto; width: 200px; margin-bottom: 0; }
    .meta-grid { display: grid; grid-template-columns: 1fr; gap: 0.75rem; }
    /* Correct Answer / Points keep a fixed width; Image and Audio/Video URL
       split whatever is left equally, so they fill the row when the other
       two are hidden for a question type. */
    @media (min-width: 768px) {
      .meta-grid { display: flex; gap: 0.75rem; }
      .meta-grid > .meta-correct, .meta-grid > .meta-points { flex: 0 0 150px; }
      .meta-grid > .meta-image, .meta-grid > .meta-audio { flex: 1 1 0; min-width: 0; }
    }
    .q-row-chevron-btn { flex-shrink: 0; background: none; border: none; padding: 0.4rem; margin-bottom: 0; cursor: pointer; border-radius: 8px; color: var(--color-navy, #1e3a5f); opacity: 0.7; }
    .q-row-chevron-btn:hover { background: var(--color-navy-tint, #eef2f7); opacity: 1; }
    .q-row-chevron { display: inline-flex; align-items: center; flex-shrink: 0; }
    .q-row-chevron svg { width: 16px; height: 16px; }
    .q-row-toggle-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 0.9rem; font-weight: 600; color: var(--color-navy, #1e3a5f); margin-bottom: 0; }
    .q-row-body { margin-top: 1.25rem; padding-top: 1.25rem; border-top: 1px solid var(--color-gray-200, #e4e3df); }
    .q-row.collapsed .q-row-body { display: none; }
    .q-row.collapsed { padding-top: 0.9rem; padding-bottom: 0.9rem; }
    .help-hint { display: inline-flex; align-items: center; margin-left: 0.35rem; cursor: help; opacity: 0.6; font-weight: 400; vertical-align: middle; }
    .help-hint svg { width: 13px; height: 13px; }

    .richtext-editor { min-height: 3rem; overflow-y: auto; }
    .richtext-editor:empty::before { content: attr(data-placeholder); color: var(--color-slate-blue, #5b6670); opacity: 0.6; }

    .q-insert-between { display: flex; align-items: center; justify-content: center; height: 1.5rem; margin: -0.5rem 0 0.5rem; position: relative; }
    .q-insert-between::before { content: ''; position: absolute; left: 0; right: 0; top: 50%; border-top: 1px dashed var(--color-navy-tint, #e2e8f0); opacity: 0; transition: opacity 0.15s ease; }
    .q-insert-between:hover::before { opacity: 1; }
    .q-insert-btn { position: relative; z-index: 1; display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 9999px; border: 1px solid var(--color-navy-tint, #e2e8f0); background: #fff; color: var(--color-navy, #1e3a5f); opacity: 0; cursor: pointer; transition: opacity 0.15s ease, background 0.15s ease; }
    .q-insert-btn svg { width: 14px; height: 14px; }
    .q-insert-between:hover .q-insert-btn, .q-insert-btn:focus-visible { opacity: 1; }
    .q-insert-btn:hover { background: var(--color-navy-tint, #eef2f7); }
    .q-row-flash { animation: q-row-flash-anim 1.6s ease; }
    @keyframes q-row-flash-anim { 0% { box-shadow: 0 0 0 3px var(--color-gold, #d4a24c); } 100% { box-shadow: none; } }
  </style>
</head>
<body class="bg-bg-warm flex flex-col min-h-screen">

  <div data-include="/assets/partials/header.html"></div>

  <main class="container-max max-w-6xl px-4 pt-32 pb-16 md:pt-40 flex-1 w-full">

    <div id="password-gate" class="card-flat bg-white p-6">
      <h3 class="mb-3">Admin Login</h3>
      <p class="mb-4 text-sm">Enter the admin password to manage placement test questions.</p>
      <input type="password" id="admin-password" class="input-base mb-3" placeholder="Password" />
      <button id="login-btn" class="btn-primary w-full justify-center">Continue</button>
      <p id="login-error" class="text-terra text-sm mt-2 hidden"></p>
    </div>

    <div id="session-loading">
      <div class="spinner-sm"></div>
      <p class="text-sm text-slate-blue">Signing you back in…</p>
    </div>

    <div id="editor" class="hidden">
      <div class="flex items-center justify-between mb-6 flex-wrap gap-3">
        <h1 class="text-2xl font-bold">Placement Test — Question Editor</h1>
        <div class="flex gap-3">
          <button id="add-section-btn" class="btn-secondary">+ New Section</button>
          <button id="logout-btn" class="btn-secondary">Log Out</button>
        </div>
      </div>
      <div class="flex gap-6 items-start">
        <nav id="section-nav" class="w-64 shrink-0 sticky top-32 space-y-1 max-h-[75vh] overflow-y-auto pr-2"></nav>
        <div id="sections-container" class="flex-1 min-w-0"></div>
      </div>
    </div>

  </main>

  <div data-include="/assets/partials/footer.html"></div>

  <script src="/assets/js/admin-placement-questions.js"></script>
  <script src="/assets/js/main.js"></script>
</body>
</html>
