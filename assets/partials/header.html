<header class="fixed top-0 left-0 right-0 z-50 pt-3 md:pt-5 px-3 md:px-6" x-data="{ mobileOpen: false }">
  <div class="container-max">
    <div class="bg-white rounded-2xl shadow-soft-lg">
      <div class="flex items-center gap-6 py-3 pl-5 pr-3 md:pl-7 md:pr-4">
        <!-- Logo / Brand — flex-1 here and on the right group pins the nav to true centre -->
        <a href="/" class="flex items-center shrink-0 md:flex-1">
          <span class="text-2xl font-extrabold tracking-heading text-navy hover:opacity-80 transition-opacity">Fluent Path</span>
        </a>

        <!-- Desktop Nav -->
        <nav class="hidden md:flex gap-7 items-center justify-center">
          <a href="/" class="text-slate-blue hover:text-navy font-medium transition-colors">Home</a>
          <a href="/test-your-english.html" class="text-slate-blue hover:text-navy font-medium transition-colors">Test Your English</a>
          <div class="relative group">
            <button class="text-slate-blue hover:text-navy font-medium flex items-center gap-1 transition-colors">
              Courses
              <i data-lucide="chevron-down" style="width: 16px; height: 16px;"></i>
            </button>
            <div class="absolute left-0 pt-3 w-52 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200">
              <div class="bg-white rounded-xl shadow-soft-lg py-2">
                <a href="/courses/" class="block px-4 py-2 hover:bg-cream text-navy">All Courses</a>
                <a href="/courses/intensive-english.html" class="block px-4 py-2 hover:bg-cream text-navy">Intensive English</a>
                <a href="/courses/one-to-one/" class="block px-4 py-2 hover:bg-cream text-navy">1-to-1 Courses</a>
                <a href="/courses/speaking.html" class="block px-4 py-2 hover:bg-cream text-navy">Speaking Course</a>
                <a href="/ielts/" class="block px-4 py-2 hover:bg-cream text-navy">IELTS Preparation</a>
              </div>
            </div>
          </div>
          <a href="/referral.html" class="text-slate-blue hover:text-navy font-medium transition-colors">Referral Program</a>
        </nav>

        <!-- Right group — mirrors the logo's flex-1 so the nav sits dead centre -->
        <div class="flex items-center justify-end ml-auto md:ml-0 md:flex-1">
          <!-- Desktop CTA -->
          <a href="/test-your-english.html" class="hidden md:inline-flex items-center gap-2 px-5 py-2.5 bg-navy text-white font-bold rounded-full hover:bg-navy-deep transition-colors shrink-0">
            Start Free Test
          </a>

          <!-- Mobile Menu Toggle -->
          <button @click="mobileOpen = !mobileOpen" :aria-expanded="mobileOpen" aria-label="Toggle navigation"
                  class="md:hidden p-2 rounded-lg hover:bg-cream focus:outline-none focus:ring-2 focus:ring-navy">
            <i data-lucide="menu" x-show="!mobileOpen"></i>
            <i data-lucide="x" x-show="mobileOpen" x-cloak></i>
          </button>
        </div>
      </div>

      <!-- Mobile Nav Drawer -->
      <div x-show="mobileOpen" x-cloak @click.outside="mobileOpen = false"
           class="md:hidden border-t border-navy/10 py-5 px-5 rounded-b-2xl">
        <nav class="flex flex-col gap-4">
          <a href="/" class="text-navy font-semibold">Home</a>
          <a href="/test-your-english.html" class="text-navy font-semibold">Test Your English</a>
          <div>
            <p class="text-xs font-bold tracking-widest text-gold-text uppercase mb-2">Courses</p>
            <div class="flex flex-col gap-2 pl-3">
              <a href="/courses/" class="text-slate-blue">All Courses</a>
              <a href="/courses/intensive-english.html" class="text-slate-blue">Intensive English</a>
              <a href="/courses/one-to-one/" class="text-slate-blue">1-to-1 Courses</a>
              <a href="/courses/speaking.html" class="text-slate-blue">Speaking Course</a>
              <a href="/ielts/" class="text-slate-blue">IELTS Preparation</a>
            </div>
          </div>
          <a href="/referral.html" class="text-navy font-semibold">Referral Program</a>
          <a href="/test-your-english.html" class="mt-2 inline-flex items-center justify-center gap-2 px-5 py-3 bg-navy text-white font-bold rounded-full">
            Start Free Test
          </a>
        </nav>
      </div>
    </div>
  </div>
</header>
